<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">SOLMORA — Mediterranean Orchard Preserves</title>
  <desc id="banner-desc">Editorial banner for SOLMORA featuring a botanical citrus emblem, serif wordmark, and stylized Mediterranean arched horizon.</desc>
  <defs>
    <clipPath id="card-clip">
      <rect x="1" y="1" width="1278" height="358" rx="22"/>
    </clipPath>
    <clipPath id="arch-clip">
      <path d="M824 360 V222 A188 188 0 0 1 1200 222 V360 Z"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1278" height="358" rx="22" fill="#fdf3eb"/>

  <g clip-path="url(#card-clip)">
    <!-- Subtle sand backdrop wash on right -->
    <path d="M720 0 H1280 V360 H640 C690 250 715 130 720 0 Z" fill="#f3e5d6" fill-opacity="0.38"/>

    <!-- Outer hairline arch echo -->
    <path d="M812 360 V222 A200 200 0 0 1 1212 222 V360" fill="none" stroke="#e94e1b" stroke-opacity="0.28" stroke-width="1"/>

    <!-- Main Mediterranean arched horizon alcove -->
    <path d="M824 360 V222 A188 188 0 0 1 1200 222 V360 Z" fill="#f3e5d6"/>

    <g clip-path="url(#arch-clip)">
      <!-- Sun orbit rings -->
      <circle cx="1012" cy="186" r="144" fill="none" stroke="#762530" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="4 6"/>
      <circle cx="1012" cy="186" r="102" fill="none" stroke="#f39200" stroke-opacity="0.35" stroke-width="1.2"/>

      <!-- Warm golden Mediterranean sun -->
      <circle cx="1012" cy="176" r="76" fill="#f39200" fill-opacity="0.2"/>
      <circle cx="1012" cy="176" r="58" fill="#f39200"/>

      <!-- Layered orchard hills -->
      <path d="M800 256 C878 214 958 222 1034 248 C1104 272 1164 234 1224 246 V370 H800 Z" fill="#e94e1b"/>
      <path d="M812 284 C886 250 962 262 1038 272 C1110 282 1168 258 1218 266" fill="none" stroke="#fdf3eb" stroke-opacity="0.45" stroke-width="1.2"/>
      <path d="M800 306 C882 282 950 298 1028 286 C1106 274 1164 294 1224 282 V370 H800 Z" fill="#762530"/>

      <!-- Tiny orchard citrus accents -->
      <circle cx="888" cy="242" r="3.5" fill="#f39200"/>
      <circle cx="914" cy="252" r="2.8" fill="#fdf3eb" fill-opacity="0.85"/>
      <circle cx="1142" cy="252" r="3.5" fill="#f39200"/>
      <circle cx="1012" cy="306" r="3" fill="#e94e1b"/>
    </g>

    <!-- Arch border hairline -->
    <path d="M824 360 V222 A188 188 0 0 1 1200 222 V360" fill="none" stroke="#762530" stroke-opacity="0.22" stroke-width="1.2"/>

    <!-- Fine citrus & leaf botanical emblem matching index.html brand icon -->
    <g transform="translate(36 42) scale(1.12)">
      <circle cx="75" cy="35" r="13" fill="#f39200" fill-opacity="0.22"/>
      <path d="M72 39Q75 12 104 8Q104 32 78 36M75 36Q47 34 43 11Q70 13 75 36" fill="none" stroke="#762530" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="75" cy="35" r="13" fill="none" stroke="#762530" stroke-width="1.35"/>
      <path d="M75 22v26M62 35h26M66 26l18 18M66 44l18-18" stroke="#762530" stroke-width="0.65"/>
    </g>

    <!-- Editorial kicker & hairline -->
    <text x="172" y="84" fill="#e94e1b" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="4.2">ORCHARD &amp; PANTRY</text>
    <line x1="378" y1="80" x2="758" y2="80" stroke="#762530" stroke-opacity="0.2" stroke-width="1"/>

    <!-- Serif wordmark -->
    <text x="84" y="216" fill="#762530" font-family="Georgia, 'Times New Roman', serif" font-size="124" font-weight="400" letter-spacing="-4.5">solmora</text>

    <!-- Subtitle -->
    <text x="88" y="272" fill="#762530" font-family="Georgia, 'Times New Roman', serif" font-size="22" letter-spacing="0.2">A little sun, preserved. <tspan fill="#e94e1b" dx="2" dy="-1">·</tspan><tspan dx="4" dy="1" fill="#762530" fill-opacity="0.82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.5">Mediterranean Orchard Preserves</tspan></text>

    <!-- Subtle editorial palette dots & footer rule -->
    <g transform="translate(88 314)">
      <circle cx="5" cy="0" r="4.5" fill="#f39200"/>
      <circle cx="21" cy="0" r="4.5" fill="#e94e1b"/>
      <circle cx="37" cy="0" r="4.5" fill="#762530"/>
      <circle cx="53" cy="0" r="4.5" fill="#f3e5d6" stroke="#762530" stroke-opacity="0.3" stroke-width="1"/>
      <text x="72" y="3.5" fill="#762530" fill-opacity="0.58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" letter-spacing="2.8">FIVE SMALL-BATCH CONCEPT PRESERVES</text>
    </g>
  </g>

  <!-- Card border rendered last for crisp edge on both light and dark themes -->
  <rect x="1" y="1" width="1278" height="358" rx="22" fill="none" stroke="#76253026" stroke-width="1.5"/>
</svg>
